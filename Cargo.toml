# ============================================================
# RemoteDesktopControl · Rust workspace 根清单
#
# 用途：统一管理 15 个 rdc-* crate 的成员列表、版本与第三方依赖版本。
# 层级：仓库根（不属于任何 crate）。
# 被谁调用：cargo（本地与 CI）读取本清单决定 workspace 成员与依赖解析。
# 目录真源：docs/09-目录结构与命名规范.md §2。
# ============================================================

[workspace]
resolver = "2"
members = [
    "crates/rdc-protocol",
    "crates/rdc-runtime",
    "crates/rdc-security",
    "crates/rdc-connect",
    "crates/rdc-transport",
    "crates/rdc-capture",
    "crates/rdc-codec",
    "crates/rdc-decode",
    "crates/rdc-input",
    "crates/rdc-clipboard",
    "crates/rdc-filetransfer",
    "crates/rdc-core",
    "crates/rdc-bridge",
    "crates/rdc-signal",
    "crates/rdc-relay",
    "crates/rdc-cli",
    "crates/rdc-linux-e2e",
]

[workspace.package]
# 版本号唯一真源：CI 打包脚本从这里读取，禁止在各 crate 内重复手写。
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["RDC Team"]

[workspace.dependencies]
# 协议序列化：只有 rdc-protocol 需要，其余 crate 通过 protocol 的类型间接使用。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误定义：每个 crate 用 thiserror 定义本层错误，再在 rdc-core 收敛为 RdcError。
thiserror = "2"
# 异步运行时：网络任务（tx/rx/NACK 定时器）统一跑在共享的 tokio 多线程 runtime 上。
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# 日志门面：库代码只依赖 tracing，不直接 println，便于被 Flutter/CLI 重定向。
tracing = "0.1"
# FFI 桥接：仅 rdc-bridge 依赖，版本必须与 app/pubspec.yaml 中 Dart 依赖严格一致。
flutter_rust_bridge = "=2.13.0"

# --- S2 会话安全与信令传输依赖（docs/07 §2、§5）---
# 身份与临时密钥：X25519 只做密钥交换，Ed25519 只做身份签名，两者职责不混用。
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
# 密钥派生：HKDF-SHA256 是唯一派生入口，禁止用哈希直接当密钥。
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
# 对称加密：桌面优先 AES-256-GCM，移动端可切 ChaCha20-Poly1305。
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# PAKE：配对码作为口令参与密钥交换，消除离线爆破（docs/07 §2.1）。
spake2 = "0.4"
# 编解码辅助：信令里的密钥/挑战/签名均为 Base64 文本。
base64 = "0.22"
# 随机源与常量时间比较：比较失败路径必须耗时一致，防时序侧信道。
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
zeroize = "1"

# --- S2 信令传输依赖（docs/07 §2.4：强制 TLS 1.3 over QUIC）---
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
bytes = "1"
futures = "0.3"

# --- S3a 平台 API（docs/06 §1、§2；仅 Windows 后端使用）---
# windows crate 采用官方绑定，覆盖 DXGI Desktop Duplication 与 Media Foundation；
# 许可为 MIT/Apache-2.0，不引入任何 GPL 编解码组件。
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# --- S8 Linux X11 平台依赖（仅 Linux 后端使用，见 research/linux-x11-design.md）---
# x11rb 为纯 Rust X11 协议实现：不需要 libX11/libxcb 头文件，便于 CI 与容器构建；
# 只开启实际用到的扩展，避免拉入无关协议代码。
x11rb = { version = "0.13", features = ["randr", "shm", "xfixes", "xtest"] }
# libc 仅用于 XShm 共享内存段（shmget/shmat）与 uinput ioctl，均属 Linux 平台 API。
libc = "0.2"

# --- 内部 crate 依赖（统一在此声明，crate 内用 workspace = true 引用）---
rdc-protocol = { path = "crates/rdc-protocol" }
rdc-runtime = { path = "crates/rdc-runtime" }
rdc-security = { path = "crates/rdc-security" }
rdc-connect = { path = "crates/rdc-connect" }
rdc-transport = { path = "crates/rdc-transport" }
rdc-capture = { path = "crates/rdc-capture" }
rdc-codec = { path = "crates/rdc-codec" }
rdc-decode = { path = "crates/rdc-decode" }
rdc-input = { path = "crates/rdc-input" }
rdc-clipboard = { path = "crates/rdc-clipboard" }
rdc-filetransfer = { path = "crates/rdc-filetransfer" }
rdc-core = { path = "crates/rdc-core" }
rdc-bridge = { path = "crates/rdc-bridge" }
rdc-signal = { path = "crates/rdc-signal" }
# Linux 本机回环链路复用 S8-2 的协议/解码实现，避免桥接层再复制一份（仅 Linux 编译）。
rdc-linux-e2e = { path = "crates/rdc-linux-e2e" }

# 性能敏感路径统一开启优化，Debug 构建也保证 S1 自检不被拖慢（无业务逻辑，仅留约定）。
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# ============================================================
# 文件用途：Gradle 全局属性
#
# 层级：app/android
# 边界：只放构建参数；仓库镜像见 settings.gradle.kts / build.gradle.kts
# ============================================================

# JVM 内存：8G 堆对 16G 内存的构建机足够；超过 4G Metaspace 无实际收益。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# 并行/缓存：单模块项目收益有限，但 CI 多次构建可复用缓存。
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Flutter 3.47 模板为 AGP 9 生成；这两个开关必须与模板保持一致，
# 否则 AGP 会按新 DSL 解析并报 kotlin 插件缺失。
android.newDsl=false
android.builtInKotlin=false

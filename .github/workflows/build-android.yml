# ============================================================
# 工作流用途：Android APK 构建（cargo-ndk 交叉编译 Rust 桥接库 + Flutter 打包）
#
# 层级：CI（docs/10 §7.1 的 build-android；§7.2 步骤顺序）
# 触发：手动 workflow_dispatch；推送到 master 或 ci/github-actions 分支
# 产物：artifact `rdc-android`（arm64-v8a / armeabi-v7a APK 及 .sha256）
#
# 工具链固定：ubuntu-22.04 / Rust 1.99.1 / Flutter 3.47.9 / JDK 17 /
#             Android NDK 28.2.13676358（禁止 latest 浮动，docs/10 §7.4）。
#
# 签名策略：本工作流不透传任何 keystore 凭据。没有 ANDROID_KEYSTORE_* 时，
# packaging/android/build_apk.sh 会显式降级为 debug 签名并在日志里警告，
# 因此产物**不可上架、也不保证能覆盖升级**；正式签名需在仓库 Secrets 配置
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD 后由同一脚本自动切换为 release 签名。
# ============================================================
name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [master, ci/github-actions]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.1"
  RUSTUP_TOOLCHAIN: "1.99.1"
  FLUTTER_VERSION: "3.47.9"
  ANDROID_NDK_VERSION: "28.2.13676358"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # -----** 1. JDK 17（AGP 与 Kotlin 编译目标一致）**-----
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -----** 2. Android SDK 与固定版本 NDK**-----
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK ${{ env.ANDROID_NDK_VERSION }}
        shell: bash
        run: |
          set -eo pipefail
          # setup-android 已接受许可；这里再兜底一次，避免 NDK 下载被许可卡住。
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "platform-tools"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK 安装位置：${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      # -----** 3. Rust 交叉编译目标（只装 Android 需要的两个）**-----
      - name: 安装 Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 缓存 Cargo registry 与 target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          workspaces: ". -> target"

      # -----** 4. Flutter SDK**-----
      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # -----** 5. cargo-ndk（用预编译安装，避免每次 cargo install 编译**-----
      - name: 安装 cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # -----** 6. Gradle 缓存（docs/10 §7.3）**-----
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # -----** 7. 构建 APK（复用 packaging/android/build_apk.sh）**-----
      - name: 构建 APK
        shell: bash
        env:
          # 有 Secrets 时走 release 签名；无 Secrets 时脚本自动降级 debug 并警告。
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          ./packaging/android/build_apk.sh 2>&1 | tee build-android.log

      # -----** 8. 产物硬断言 + 清单**-----
      - name: 校验产物并打印清单
        shell: bash
        run: |
          set -eo pipefail
          shopt -s nullglob
          apks=(dist/RDC-*-android-*arm64-v8a*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "未产出 arm64-v8a APK" >&2
            exit 1
          fi
          ls -lh dist/*.apk
          for f in dist/*.apk; do sha256sum "$f"; done | tee dist/CHECKSUMS.txt

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: rdc-android
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: build-android.log
          if-no-files-found: warn
          retention-days: 14

# ============================================================
# 工作流用途：RDC 多平台 CI（Rust 核心 + Flutter 五平台 + 打包 + 合规）
#
# 层级：CI（docs/10 §3 六个 job：rust / windows / macos / linux / android / compliance）
# 调用方：GitHub Actions（push / PR / 手动 / tag）
#
# 凭据缺失时的降级方案（都在日志中显式说明，不让流水线默默失败）：
#   - Android 无 ANDROID_KEYSTORE_* → debug 签名 APK（不可上架）
#   - iOS 无证书/IOS_TEAM_ID → 无签名 xcarchive
#   - macOS 一律 ad-hoc 签名，不公证
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.47.9"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====** 1. Rust 静态检查与测试 =====**
  rust:
    name: Rust check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy（error 即失败，warning 记录）
        run: cargo clippy --workspace --all-targets
      - name: 单元测试
        run: cargo test --workspace
      - name: 基准骨架（S1 只要求可运行并留存基线）
        run: |
          cargo bench --workspace 2>&1 | tee bench-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rust-bench-baseline
          path: bench-output.txt

  # =====** 2. Windows 构建与 NSIS 安装包 =====**
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装 NSIS
        run: choco install nsis -y --no-progress
      - name: 构建与打包
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rdc-windows
          path: dist/*

  # =====** 3. macOS dmg + iOS xcarchive =====**
  macos:
    name: macOS & iOS package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: macOS dmg（ad-hoc 签名）
        run: ./packaging/macos/build_dmg.sh
      - name: iOS xcarchive（无签名）
        run: ./packaging/ios/build_xcarchive.sh
        env:
          # 缺少团队 ID 时脚本自动降级为 --no-codesign，并在日志说明。
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: rdc-macos-ios
          path: dist/*

  # =====** 4. Linux AppImage + deb =====**
  linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev pkg-config
      - name: AppImage
        run: ./packaging/linux/build_appimage.sh
      - name: deb
        run: ./packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rdc-linux
          path: dist/*

  # =====** 5. Android APK =====**
  android:
    name: Android package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: 构建 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 统一 NDK 环境变量：setup-android 不一定导出 NDK_HOME，这里取最新版本目录。
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          fi
          echo "NDK: $ANDROID_NDK_HOME"
          ./packaging/android/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rdc-android
          path: dist/*

  # =====** 6. 合规：NOTICE + SBOM =====**
  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 生成 NOTICE 与 SBOM
        run: |
          python3 .github/scripts/compliance.py
      - uses: actions/upload-artifact@v4
        with:
          name: rdc-compliance
          path: |
            dist/NOTICE.txt
            dist/sbom.cdx.json

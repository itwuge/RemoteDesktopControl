# ============================================================
# rdc-cli · crate 清单
#
# 用途：无 UI 验证工具：doctor / selftest / host / connect / bench（docs/02 §1.1）。
# 层级：L4 验证入口，只依赖 core/protocol，禁止依赖 bridge。
# ============================================================

[package]
name = "rdc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RDC 命令行自检与直连验证工具"

[[bin]]
name = "rdc-cli"
path = "src/main.rs"

[features]
# 打开 FFmpeg 解码后端（LGPL 共享构建）；需同时设置 FFMPEG_DIR。
ffmpeg = ["rdc-decode/ffmpeg"]

[dependencies]
rdc-core = { workspace = true }
rdc-clipboard = { workspace = true }
rdc-input = { workspace = true }
rdc-protocol = { workspace = true }
rdc-connect = { workspace = true }
rdc-security = { workspace = true }
rdc-signal = { workspace = true }
rdc-capture = { workspace = true }
rdc-codec = { workspace = true }
rdc-decode = { workspace = true }
rdc-runtime = { workspace = true }
rdc-transport = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# S3a 端到端自检需要创建全屏动态图案窗口（测试夹具，不属于产品代码）。
windows = { workspace = true }

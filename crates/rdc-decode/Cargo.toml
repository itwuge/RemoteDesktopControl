# ============================================================
# rdc-decode · crate 清单
#
# 用途：H.264 解码（MF 硬件优先，失败显式回退）、解码队列与 D3D11 上屏。
# 层级：L3 编解码层的下行半边，消费 rdc-transport 的码流，向呈现窗口交付 D3D11 纹理。
# 依赖纪律：不依赖 UI 框架；平台 API 只出现在 src/platform/*.rs 与 present.rs。
# ============================================================

[package]
name = "rdc-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RDC 视频解码、解码队列与 D3D11 上屏"

[features]
# FFmpeg 解码后端（LGPL 共享构建，动态链接）。默认关闭：仓库默认仍是 MF 路径；
# 打开时必须设置 FFMPEG_DIR 指向 LGPL 共享构建根目录。
ffmpeg = []

[dependencies]
rdc-protocol = { workspace = true }
rdc-runtime = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[build-dependencies]
# 仅用于编译 FFmpeg 解码 C shim；feature 关闭时不编译任何 C 代码。
cc = "1"

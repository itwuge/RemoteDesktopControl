# ============================================================
# rdc-security · crate 清单
#
# 用途：身份密钥、临时密钥协商、AEAD、握手状态机与权限位（S1 仅有空壳与错误类型）。
# 层级：L2 能力层，位于 rdc-protocol 之上，被 rdc-connect / rdc-core 使用。
# 依赖纪律：不引入网络栈与平台 API（docs/09 §2.3）。
# ============================================================


# ============================================================
# rdc-bridge · crate 清单
#
# 用途：唯一的 FFI 出口，由 flutter_rust_bridge 生成 Dart 绑定（docs/02 §1.1）。
# 层级：L4 桥接层，只做类型转换与生命周期托管，不含业务实现。
# 产物：cdylib（桌面/Android）、staticlib（iOS）。
# ============================================================

[package]
name = "rdc-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RDC 与 Flutter 之间的 FFI 桥接层"

[lib]
# cdylib 供 Windows/Linux/Android 动态加载；staticlib 供 iOS 静态链接。
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rdc-core = { workspace = true }
rdc-security = { workspace = true }
rdc-protocol = { workspace = true }
rdc-capture = { workspace = true }
rdc-codec = { workspace = true }
rdc-decode = { workspace = true }
rdc-input = { workspace = true }
rdc-clipboard = { workspace = true }
rdc-filetransfer = { workspace = true }
rdc-diag = { workspace = true }
serde_json = { workspace = true }
flutter_rust_bridge = { workspace = true }

[features]
# FFmpeg 解码后端（LGPL 共享构建）。发布包启用：应用默认走 FFmpeg，MF 保留回退。
# 打开后构建必须提供 FFMPEG_DIR（见 crates/rdc-decode/build.rs）。
ffmpeg = ["rdc-decode/ffmpeg"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# 复用 S8-2 已验证的回环线协议与外部 ffmpeg 解码管道，避免桥接层复制一份实现。
rdc-linux-e2e = { workspace = true }

# ============================================================
# rdc-capture · crate 清单
#
# 用途：屏幕采集抽象（显示器枚举、帧类型、采集源 trait）与按平台的采集后端入口。
# 层级：L3 采集层，消费 rdc-runtime 的缓冲原语，向 rdc-codec 交付帧。
# 依赖纪律：不依赖 UI 框架；平台 API 只出现在 src/platform/*.rs。
# ============================================================

[package]
name = "rdc-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RDC 屏幕采集抽象与平台后端"

[dependencies]
rdc-protocol = { workspace = true }
rdc-runtime = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# 平台 API 只允许出现在 src/platform/*.rs；Windows 后端使用 DXGI + D3D11 + GDI。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

# Linux 后端：x11rb 走 X11 协议，libc 提供 XShm 共享内存段。
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { workspace = true, features = ["randr", "shm", "xfixes"] }
libc = { workspace = true }

# 实测探针示例需要日志订阅器（库本身只用 tracing 门面）。
[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
